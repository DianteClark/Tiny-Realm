<!doctype html><html><body style="margin:0;background:#47aba9">
<canvas id="c"></canvas>
<script type="module">
// ?seed=N            the 46x34 island generator on its own
// ?seed=N&annex=K    the 96x72 home sea with K annexed chunks (random sides), plus a rules audit in the title
import { loadAll, drawSprite } from '../src/assets.js';
import { generateIsland, renderTerrain, foamCells, rng, T, annexSlot, mergeAnnex, auditMap, ANNEX_SIDES } from '../src/terrain.js';
import { buildHomeMap, castleCell, ANNEX_SIZES } from '../src/annex.js';
await loadAll();
const q = new URLSearchParams(location.search);
const seed = +(q.get('seed') || 7), annexN = q.get('annex');
let m, audit = '';
if (annexN == null) {
  m = generateIsland({ w: 46, h: 34, seed, plateaus: 6, highs: 2, reserve: { x: 19, y: 13, w: 7, h: 6 }, colors: [1, 3, 2], landFrac: 0.6 });
} else {
  const cfg = { w: 96, h: 72, baseW: 46, baseH: 34, ox: 25, oy: 19, castle: { x: 45, y: 33, w: 5, h: 2 } };
  m = buildHomeMap(cfg, seed, []).map;
  const r = rng(seed + 1);
  for (let k = 0, done = 0; k < 60 && done < +annexN; k++) {
    const size = r.int(1, 3), [w, h] = ANNEX_SIZES[size], side = r.pick(ANNEX_SIDES);
    const slot = annexSlot(m, side, w, h, r.pick([0, 3, -3, 6, -6]));
    if (!slot) continue;
    mergeAnnex(m, { seed: seed * 31 + k, side, size, ...slot }, castleCell(cfg));
    done++;
  }
  audit = ' audit:' + auditMap(m, castleCell(cfg)).length;
}
const tc = renderTerrain(m);
const c = document.getElementById('c'); c.width = tc.width; c.height = tc.height;
const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
x.fillStyle = '#47aba9'; x.fillRect(0, 0, c.width, c.height);
for (const f of foamCells(m, rng(1))) drawSprite(x, 'foam', f.x * T + 32, f.y * T + 32, f.t);
x.drawImage(tc, 0, 0);
for (const d of m.decor) drawSprite(x, d.type === 'bush' ? 'bush' + d.v : d.type === 'rock' ? 'rock' + d.v : 'wrock' + d.v, d.x * T + 32, d.y * T + 48, d.t);
document.title = 'done' + audit;
</script></body></html>
